# Контроль обучения сотрудников в рабочей группе. Все тексты и время — здесь.
# Расписание можно менять и командой /schedule (изменения хранятся в базе и важнее этого файла).
# Плейсхолдеры: {name} — упоминание сотрудника, {client}, {when}, {text} — по смыслу.

enabled = true
timezone = "Europe/Kyiv"

[schedule]
work_start = "10:00"
work_end = "19:00"
work_days = [0, 1, 2, 3, 4, 5]  # 0 — понедельник … 6 — воскресенье
first_check = "13:00"           # к этому времени у каждого должна быть хотя бы одна запись
followup_minutes = 60           # нет ответа на упоминание — написать в личку через столько минут
daily_report = "19:30"
weekly_report_day = 6           # воскресенье
weekly_report = "20:00"
reschedule_default = "10:00"    # перенос без времени — напомнить в это время

[texts]
ask_caption = "Добавь подпись: Имя | Клиент | Результат\nРезультат: ✅ закрыл / 🔄 перенос (на когда) / ❌ отказ / 📵 не дозвонился"
ask_reschedule_date = "Принято. Уточни, на когда перенос — например: «перенос на пятницу 15:00»."
accepted = "Принято ✅"
accepted_reaction = "👍"
no_records_group = "{name}, сегодня ещё нет записей. Что случилось?"
no_records_dm = "Сегодня от тебя ещё нет записей в рабочей группе. Что случилось? Напиши коротко — я передам владельцу."
reason_saved = "Спасибо, передал владельцу."
reschedule_reminder = "Напоминание: сегодня перезвонить клиенту {client} ({when})."
question_redirect = "Разбор звонков и советы по продажам даёт владелец — я передал ему твой вопрос. Пока можешь переслушать свою запись и разборы владельца."
employee_start = "Привет! Я слежу за записями в рабочей группе и передаю информацию владельцу. Твоя статистика за неделю — /my. Советы по организации обучения — /tips."
not_employee = "🔒 Это рабочий бот. Доступ — только для сотрудников группы."
tips = """Как выстроить обучение:
• Планируй день: время на звонки и 15–20 минут на разбор своих записей.
• Записывай каждый диалог и отправляй сразу после звонка — не копи на вечер.
• Переслушивай свои записи: что сказал клиент, где разговор пошёл не так.
• Читай разборы владельца к своим и чужим записям — это самое ценное обучение.
• Вопросы по работе с клиентами задавай владельцу — я их передам."""
